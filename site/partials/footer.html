<footer class="site-footer">
  <div class="site-footer-inner wa-stack">
    <div
      class="eq-meter"
      aria-hidden="true"
    >
      <span style="--level: 0.5"></span>
      <span style="--level: 0.8"></span>
      <span style="--level: 0.95"></span>
      <span style="--level: 0.7"></span>
      <span style="--level: 0.85"></span>
      <span style="--level: 0.6"></span>
      <span style="--level: 0.75"></span>
      <span style="--level: 0.5"></span>
      <span style="--level: 0.6"></span>
      <span style="--level: 0.4"></span>
      <span style="--level: 0.55"></span>
      <span style="--level: 0.35"></span>
      <span style="--level: 0.45"></span>
      <span style="--level: 0.25"></span>
      <span style="--level: 0.3"></span>
      <span style="--level: 0.15"></span>
    </div>
    <div class="site-footer-row wa-split">
      <p class="site-footer-mark wa-gap-m wa-align-items-baseline">
        <a
          class="site-footer-wordmark hop-quiet"
          href="./"
        >
          <hue-hop hue="dusk">{{wordmark}}</hue-hop>
        </a>
        <wa-divider orientation="vertical"></wa-divider>
        <span class="readout-label wa-cluster wa-gap-m">
          v{{version}}
          <wa-divider orientation="vertical"></wa-divider>
          MIT
        </span>
      </p>
      <ul class="wa-cluster wa-gap-l wa-list-plain">
        <li>
          <a
            class="hop-link is-quiet"
            href="{{docs-url}}"
          >
            README
          </a>
        </li>
        <li>
          <a
            class="hop-link is-quiet"
            href="{{repo-url}}"
          >
            GitHub
          </a>
        </li>
        <li>
          <a
            class="hop-link is-quiet"
            href="https://www.npmjs.com/package/hue-hop"
          >
            npm
          </a>
        </li>
        <li>
          <a
            class="hop-link is-quiet"
            href="{{repo-url}}/issues"
          >
            Issues
          </a>
        </li>
      </ul>
    </div>
    <p class="site-footer-credit">
      Shout out to
      <a
        class="hop-link"
        href="https://mdrng.com/"
      >
        mdrng
      </a>
      and the per-letter wordmark that sparked Hue Hop.
    </p>
  </div>
</footer>
