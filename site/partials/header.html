<header
  class="site-header"
  slot="header"
>
  <div class="site-header-inner">
    <a
      class="site-wordmark hop-quiet"
      href="{{root}}"
      data-nav="home"
    >
      <hue-hop hue="dusk">{{wordmark}}</hue-hop>
    </a>
    <nav
      class="site-nav wa-gap-l"
      aria-label="Site"
    >
      <a
        class="hop-link is-quiet"
        href="{{docs-url}}"
        data-nav="docs"
      >
        Docs
      </a>
      <a
        class="hop-link is-quiet"
        href="{{studio-url}}"
        data-nav="studio"
      >
        Studio
      </a>
      <a
        class="hop-link is-quiet"
        href="{{repo-url}}"
      >
        GitHub
      </a>
    </nav>
    <button
      type="button"
      class="side-toggle wa-gap-xs wa-align-items-center"
      id="side-toggle"
      role="switch"
      aria-checked="false"
    >
      <span class="wa-visually-hidden">Light</span>
      <span
        class="side-track"
        aria-hidden="true"
      >
        <span class="side-knob"></span>
        <span class="side-letter side-letter-a">D</span>
        <span class="side-letter side-letter-b">L</span>
      </span>
      <span
        class="side-name readout-label"
        aria-hidden="true"
      >
        <span class="side-name-a">Dark</span>
        <span class="side-name-b">Light</span>
      </span>
    </button>
  </div>
</header>
